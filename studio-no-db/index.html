<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Studio (No DB)</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="logo">◇</span>
        <span class="title">Studio (No DB)</span>
      </div>
      <nav class="nav">
        <a href="#/content" class="nav-link" data-route="content">Content</a>
        <a href="#/schemas" class="nav-link" data-route="schemas">Schemas</a>
        <a href="#/export" class="nav-link" data-route="export">Export/Import</a>
      </nav>
      <div class="actions">
        <button id="themeToggle" class="btn ghost" title="Toggle theme">🌓</button>
        <button id="resetApp" class="btn danger" title="Reset all data">Reset</button>
      </div>
    </header>

    <main id="app" class="app-main"></main>

    <footer class="app-footer">
      <span>Data stored locally in your browser (localStorage). No server. No database.</span>
    </footer>

    <script src="./app.js"></script>
  </body>
</html>
